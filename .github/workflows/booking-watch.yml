name: booking-watch

on:
  # schedule:
  #   # Every ~10 min, offset off :00/:10 etc. GitHub delays/drops scheduled
  #   # runs during high load (worst at the top of the hour), so the odd minutes
  #   # get served more reliably. Runs are still best-effort, not guaranteed.
  #   - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

# Allow the workflow to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Add Homebrew Python to PATH
        run: echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Diagnose Python and install dependencies
        run: |
          python3.12 --version
          python3.12 -m ensurepip --upgrade --verbose
          python3.12 -m venv -v .venv
          .venv/bin/python -m pip install -r requirements.txt


      - name: Run poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: .venv/bin/python poller.py



      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update booking-watch state [skip ci]"
            git push
          else
            echo "No state change."
          fi
